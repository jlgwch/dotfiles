general.import = ["~/.config/alacritty/dracula.toml"]

# font setting
[font]
size = 12.0

[font.normal]
family = "JetBrainsMono Nerd Font Mono"
style = "Regular"

[font.bold]
family = "JetBrainsMono Nerd Font Mono"
style = "Bold"

[font.italic]
family = "JetBrainsMono Nerd Font Mono"
style = "Italic"

[font.bold_italic]
family = "JetBrainsMono Nerd Font Mono"
style = "Bold Italic"

[selection]
save_to_clipboard = true

[window]
startup_mode = "Maximized"
decorations = "none"
opacity = 0.9
decorations_theme_variant = "Dark"
padding = {x = 10, y = 10}
